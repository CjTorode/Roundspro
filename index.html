<style>

  @media(max-width:700px){.g2,.g5{grid-template-columns:1fr}.main{padding:16px}}

<body>
<div id="app"></div>
<script>
// ── SUPABASE CONFIG ─────────────────────────────────────────────
// Pure fetch-based REST client — no external library needed
// Config stored in localStorage: cjt_sbUrl / cjt_sbKey
const USER_ID = '11ac215f-f91c-4973-a0db-86ba84ee0eba';

// ── PIN LOGIN SYSTEM ─────────────────────────────────────────────
const PINS = {
  '5126': 'admin',   // Full access
  '2205': 'driver'   // Round 2 only
};
let _role = localStorage.getItem('cjt_role') || null;
let _pin_entered = localStorage.getItem('cjt_pin_ok') === '1';

function getRole(){ return _role; }
function isAdmin(){ return _role === 'admin'; }
function isDriver(){ return _role === 'driver'; }
function isLoggedIn(){ return _role !== null; }

function doLogin(pin){
  const role = PINS[pin.trim()];
  if(role){
    _role = role;
    _pin_entered = true;
    localStorage.setItem('cjt_role', role);
    localStorage.setItem('cjt_pin_ok', '1');
    return true;
  }
  return false;
}

function doLogout(){
  _role = null;
  _pin_entered = false;
  localStorage.removeItem('cjt_role');
  localStorage.removeItem('cjt_pin_ok');
}

function showPinScreen(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;font-family:Georgia,serif';
  let pinVal = '';
  let errMsg = '';

  function renderPin(){
    wrap.innerHTML = '';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border:2px solid var(--gold);border-radius:6px;padding:36px;width:340px;max-width:100%;box-shadow:0 8px 40px rgba(0,0,0,.15);text-align:center';
    box.innerHTML = `
      <div style="font-size:36px;margin-bottom:8px">🗞</div>
      <div style="font-size:20px;font-weight:bold;letter-spacing:1px;color:#1a1a1a;margin-bottom:4px">ROUNDSPRO</div>
      <div style="font-size:11px;letter-spacing:3px;color:#aaa;text-transform:uppercase;margin-bottom:24px">Enter PIN</div>
      ${errMsg ? `<div style="background:#fff3f3;border:1px solid #e08080;border-radius:4px;padding:8px;font-size:13px;color:#b94040;margin-bottom:12px">${errMsg}</div>` : ''}
      <div style="font-size:32px;letter-spacing:12px;font-weight:bold;color:#1a1a1a;margin-bottom:20px;min-height:48px">${'●'.repeat(pinVal.length)}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-btn" data-n="${n}" style="padding:16px;font-size:20px;font-family:Georgia,serif;background:#f5f0e8;border:1px solid #ddd;border-radius:4px;cursor:pointer;font-weight:bold">${n}</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
        <button class="pin-btn" data-n="del" style="padding:16px;font-size:16px;font-family:Georgia,serif;background:#f0ebe0;border:1px solid #ddd;border-radius:4px;cursor:pointer">⌫</button>
        <button class="pin-btn" data-n="0" style="padding:16px;font-size:20px;font-family:Georgia,serif;background:#f5f0e8;border:1px solid #ddd;border-radius:4px;cursor:pointer;font-weight:bold">0</button>
        <button class="pin-btn" data-n="ok" style="padding:16px;font-size:16px;font-family:Georgia,serif;background:#1a1a1a;color:#c8a84b;border:none;border-radius:4px;cursor:pointer;font-weight:bold">OK</button>
      </div>
    `;
    wrap.appendChild(box);
    box.querySelectorAll('.pin-btn').forEach(btn => {
      btn.onclick = function(){
        const n = this.dataset.n;
        if(n === 'del'){ pinVal = pinVal.slice(0,-1); errMsg=''; renderPin(); }
        else if(n === 'ok'){
          if(doLogin(pinVal)){ startApp(); }
          else { errMsg='Incorrect PIN'; pinVal=''; renderPin(); }
        } else { if(pinVal.length < 6) pinVal += n; errMsg=''; renderPin(); }
      };
    });
  }
  renderPin();
  app.appendChild(wrap);
}

// Generate a proper UUID v4
function uuidv4(){
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>
    (c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
}

let _sbUrl = null;
let _sbKey = null;

function getSB(){ return _sbUrl && _sbKey; }

function initSupabase(url, key){
  _sbUrl = url.replace(/\/+$/, ''); // strip trailing slash
  _sbKey = key;
  localStorage.setItem('cjt_sbUrl', _sbUrl);
  localStorage.setItem('cjt_sbKey', _sbKey);
}

// Try to auto-init from stored config
(function(){
  const url = localStorage.getItem('cjt_sbUrl');
  const key = localStorage.getItem('cjt_sbKey');
  if(url && key) initSupabase(url, key);
})();

// ── REST HELPERS ─────────────────────────────────────────────────
async function sbFetch(method, table, body, params){
  let url = _sbUrl + '/rest/v1/' + table;
  if(params) url += '?' + params;
  const res = await fetch(url, {
    method,
    headers: {
      'apikey': _sbKey,
      'Authorization': 'Bearer ' + _sbKey,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const txt = await res.text();
    throw new Error(res.status + ': ' + txt);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : [];
}

async function sbSelect(table, filter){
  return await sbFetch('GET', table, null, 'select=*&user_id=eq.' + USER_ID + (filter||'') + '&limit=1000');
}

async function sbUpsert(table, rows){
  if(!rows.length) return;
  await sbFetch('POST', table, rows);
}

async function sbDelete(table, id){
  await sbFetch('DELETE', table, null, 'id=eq.' + id + '&user_id=eq.' + USER_ID);
}

// ── LOCAL STORAGE CACHE ──────────────────────────────────────────
const S={get:(k,fb)=>{try{const v=localStorage.getItem('cjt_'+k);return v?JSON.parse(v):fb}catch{return fb}},set:(k,v)=>{try{localStorage.setItem('cjt_'+k,JSON.stringify(v))}catch{}}};

// ── SUPABASE DATA LAYER ───────────────────────────────────────────
const DB = {
  SETTINGS_KEYS: ['gstRate','gstEnabled','gstNumber','defaultDelivery','showCostPrice',
    'calEvents','billingStart','billingPeriod','billingStart2','billingPeriod2','bizDetails','lastWedCharge','billStyle',
    'shopDiscountPaper','shopDiscountMag','shopEmail'],

  async saveCustomers(){
    if(!getSB()) return;
    try {
      const rows = st.customers.map(c => ({
        id: c.id,
        user_id: USER_ID,
        name: c.name,
        address: c.address,
        phone: c.phone||'',
        email: c.email||'',
        balance: c.balance||0,
        papers: c.papers||[],
        holidays: c.holidays||[],
        // paper_log omitted — add column to Supabase if needed
        delivery_charge: c.deliveryCharge||0,
        delivery_note: c.deliveryNote||'',
        gst_exempt: c.gstExempt||false,
        round_id: c.roundId||null,
        round_order: c.roundOrder||0,
        list_order: c.listOrder||0,
      }));
      await sbUpsert('customers', rows);
      // Also persist roundId/listOrder/roundOrder as a settings entry (since round_id col is uuid type)
      const roundMap = {};
      st.customers.forEach(c => { roundMap[c.id] = {roundId:c.roundId||null, roundOrder:c.roundOrder||0, listOrder:c.listOrder||0}; });
      await sbUpsert('settings', [{user_id:USER_ID, key:'customerRoundMap', value:JSON.stringify(roundMap)}]);
    } catch(e){ console.warn('saveCustomers:', e.message); }
    S.set('customers', st.customers);
  },

  async deleteCustomer(id){
    S.set('customers', st.customers);
    if(!getSB()) return;
    try { await sbDelete('customers', id); } catch(e){ console.warn('deleteCustomer:', e.message); }
  },

  async saveStock(){
    if(!getSB()) return;
    try {
      const rows = st.stock.map(s => ({
        id: s.id,
        user_id: USER_ID,
        title: s.title,
        type: s.type,
        freq: s.freq,
        stock: s.stock||0,
        sell_price: s.sellPrice||0,
        cost_price: s.costPrice||0,
        gst_applicable: s.gstApplicable||false,
        delivery_days: s.deliveryDays||[],
      }));
      await sbUpsert('stock', rows);
    } catch(e){ console.warn('saveStock:', e.message); }
    S.set('stock', st.stock);
  },

  async deleteStock(id){
    S.set('stock', st.stock);
    if(!getSB()) return;
    try { await sbDelete('stock', id); } catch(e){ console.warn('deleteStock:', e.message); }
  },

  async saveRounds(){
    if(!getSB()) return;
    try {
      const rows = st.rounds.map(r => { const {user_id, ...rest} = r; return {...rest, user_id: USER_ID}; });
      await sbUpsert('rounds', rows);
    } catch(e){ console.warn('saveRounds:', e.message); }
    S.set('rounds', st.rounds);
  },

  async savePayments(){
    if(!getSB()) return;
    try {
      const rows = st.payments.map(p => { const {user_id, ...rest} = p; return {...rest, user_id: USER_ID}; });
      await sbUpsert('payments', rows);
    } catch(e){ console.warn('savePayments:', e.message); }
    S.set('payments', st.payments);
  },

  async saveSettings(){
    if(!getSB()) return;
    try {
      const rows = DB.SETTINGS_KEYS.map(k => ({
        user_id: USER_ID,
        key: k,
        value: JSON.stringify(st[k])
      }));
      await sbUpsert('settings', rows);
    } catch(e){ console.warn('saveSettings:', e.message); }
    DB.SETTINGS_KEYS.forEach(k => S.set(k, st[k]));
  },

  async saveShopWeeks(){
    S.set('shopWeeks', st.shopWeeks); // always keep local cache
    if(!getSB()) return;
    try {
      const rows = st.shopWeeks.map(w => ({
        id: w.id,
        user_id: USER_ID,
        week_start: w.weekStart || null,
        week_end: w.weekEnd || null,
        invoice_num: String(w.invoiceNum || ''),
        papers: w.papers || [],
        mags: w.mags || [],
        overdue: parseFloat(w.overdue) || 0,
        vouchers: parseFloat(w.vouchers) || 0,
        note: w.note || '',
      }));
      await sbUpsert('shop_weeks', rows);
    } catch(e){ console.warn('saveShopWeeks:', e.message); }
  },

  async deleteShopWeek(id){
    S.set('shopWeeks', st.shopWeeks);
    if(!getSB()) return;
    try { await sbDelete('shop_weeks', id); } catch(e){ console.warn('deleteShopWeek:', e.message); }
  },

  async load(){
    if(!getSB()) return;
    try {
      const [custs, stocks, rounds, pays, settings, shopWks] = await Promise.all([
        sbSelect('customers'),
        sbSelect('stock'),
        sbSelect('rounds'),
        sbSelect('payments'),
        sbSelect('settings'),
        sbSelect('shop_weeks'),
      ]);
      if(custs && custs.length){
        const localCusts = S.get('customers', []);
        st.customers = custs.map(r=>{
        delete r.user_id;
        // Map snake_case DB columns to camelCase app fields
        if(r.delivery_charge !== undefined){ r.deliveryCharge = parseFloat(r.delivery_charge); delete r.delivery_charge; }
        if(r.delivery_note !== undefined){ r.deliveryNote = r.delivery_note||''; delete r.delivery_note; }
        if(r.gst_exempt !== undefined){ r.gstExempt = r.gst_exempt; delete r.gst_exempt; }
        const localC = localCusts.find(lc => lc.id === r.id);
        if(r.round_id !== undefined){ r.roundId = r.round_id||null; delete r.round_id; }
        else if(!r.roundId && localC){ r.roundId = localC.roundId||null; }
        delete r.round_order; // roundOrder managed by applyListOrder()
        delete r.list_order; // listOrder managed by applyListOrder(), not Supabase
        if(r.paper_log !== undefined){ r.paperLog = r.paper_log||[]; delete r.paper_log; }
        if(!r.papers) r.papers = [];
        if(!r.holidays) r.holidays = [];
        if(!r.paperLog) r.paperLog = [];
        return r;
      }); S.set('customers',st.customers); }
      if(stocks && stocks.length){ st.stock = stocks.map(r=>{
        delete r.user_id;
        if(r.cost_price !== undefined){ r.costPrice = parseFloat(r.cost_price)||0; delete r.cost_price; }
        if(r.sell_price !== undefined){ r.sellPrice = parseFloat(r.sell_price)||0; delete r.sell_price; }
        if(r.gst_applicable !== undefined){ r.gstApplicable = r.gst_applicable; delete r.gst_applicable; }
        if(r.delivery_days !== undefined){ r.deliveryDays = r.delivery_days||[]; delete r.delivery_days; }
        if(r.price_log !== undefined){ r.priceLog = r.price_log||[]; delete r.price_log; }
        if(!r.deliveryDays) r.deliveryDays = [];
        if(!r.priceLog) r.priceLog = [];
        return r;
      }); S.set('stock',st.stock); }
      if(rounds && rounds.length){ st.rounds = rounds.map(r=>{delete r.user_id;return r;}); S.set('rounds',st.rounds); }
      if(pays && pays.length){ st.payments = pays.map(r=>{delete r.user_id;return r;}); S.set('payments',st.payments); }
      if(settings){
        let roundMap = null;
        settings.forEach(row=>{
          try{
            const val=JSON.parse(row.value);
            if(row.key === 'customerRoundMap'){ roundMap = val; return; }
            if(DB.SETTINGS_KEYS.includes(row.key)) st[row.key]=val;
            S.set(row.key,val);
          }catch(e){}
        });
        // Apply round map to customers (overcomes uuid column limitation)
        if(roundMap){
          st.customers = st.customers.map(c => {
            const m = roundMap[c.id];
            if(!m) return c;
            return {...c, roundId: m.roundId||c.roundId||null, roundOrder: m.roundOrder||c.roundOrder||0};
          });
        }
        // Re-apply hardcoded list order after sync
        applyListOrder();
        S.set('customers', st.customers);
      }
      // Load shop weeks from Supabase
      if(shopWks && shopWks.length){
        st.shopWeeks = shopWks.map(r => ({
          id: r.id,
          weekStart: r.week_start || '',
          weekEnd: r.week_end || '',
          invoiceNum: r.invoice_num || '',
          papers: r.papers || [],
          mags: r.mags || [],
          overdue: r.overdue || 0,
          vouchers: r.vouchers || 0,
          note: r.note || '',
        }));
        // Sort newest first
        st.shopWeeks.sort((a,b) => (b.weekEnd||'').localeCompare(a.weekEnd||''));
        S.set('shopWeeks', st.shopWeeks);
      }
      render();
      if(!DB._silent) toast('☁ Synced from Supabase');
      DB._silent = false;
    } catch(e){
      console.warn('DB.load error:', e);
      if(!DB._silent) toast('⚠ Sync failed: ' + e.message);
      DB._silent = false;
    }
  }
};

// ── SETUP SCREEN ─────────────────────────────────────────────────
function showSetupScreen(){
  const app = document.getElementById('app');
  const stored_url = localStorage.getItem('cjt_sbUrl') || '';
  const stored_key = localStorage.getItem('cjt_sbKey') || '';
  app.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;font-family:Georgia,serif';
  wrap.innerHTML = `
    <div style="background:#fff;border:2px solid var(--gold);border-radius:6px;padding:36px;width:500px;max-width:100%;box-shadow:0 8px 40px rgba(0,0,0,.15)">
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:36px;margin-bottom:8px">🗞</div>
        <div style="font-size:20px;font-weight:bold;letter-spacing:1px;color:#1a1a1a">ROUNDSPRO</div>
        <div style="font-size:11px;letter-spacing:3px;color:#aaa;text-transform:uppercase;margin-bottom:4px">Supabase Setup</div>
        <div style="font-size:13px;color:#666;margin-top:10px">Connect your Supabase project to enable cloud sync across devices.</div>

// Returns true if customer is on holiday on a given date string
function onHoliday(c,ds){
  return (c.holidays||[]).some(h=>(h.type==='range'&&ds>=h.start&&ds<=h.end)||(h.type==='day'&&h.date===ds));
}
// Count how many days in the cycle match the given deliveryDays array (0=Sun,1=Mon…6=Sat) minus holidays
function countDeliveryDays(c,start,cycleDays,delivDays){
  if(!delivDays||!delivDays.length)return 0;
  let n=0;
  for(let i=0;i<cycleDays;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    const ds=d.toISOString().split('T')[0];
    if(delivDays.includes(d.getDay())&&!onHoliday(c,ds))n++;
  }
  return n;
}
// Total holiday days (any day) in cycle
function holDays(c,start,days){
  if(!c.holidays||!c.holidays.length)return 0;
  let n=0;
  for(let i=0;i<days;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    const ds=d.toISOString().split('T')[0];
    if(onHoliday(c,ds))n++;
  }
  return n;
}
function papersOnDate(c,dateStr){
  const log=c.paperLog||[];
  // Always start with current papers as baseline
  const active=new Set(c.papers||[]);
  if(log.length){
    const sorted=[...log].sort((a,b)=>a.date.localeCompare(b.date));
    sorted.forEach(function(entry){
      if(entry.date<=dateStr){
        if(entry.action==='add')active.add(entry.title);
        else active.delete(entry.title);
      }
    });
  }
  return [...active];
}

// Returns the sell price for a stock item on a given date, respecting price change log
function priceOnDate(item, dateStr){
  const log = (item.priceLog||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let price = item.sellPrice; // current price as fallback
  // Walk log — last entry on or before dateStr wins
  log.forEach(function(entry){ if(entry.date<=dateStr) price=entry.price; });
  return price;
}

function calcBill(c,start,days){
  const gst=st.gstEnabled?st.gstRate:0;
  const hd=start?holDays(c,start,days):0;

  // Get all titles that were active at any point during the cycle.
  // Always include current papers array — paperLog entries can add/remove on top.
  var titlesInCycle=new Set();
  (c.papers||[]).forEach(function(p){titlesInCycle.add(p);});
  if(start&&(c.paperLog||[]).length){
    var cycleEnd=new Date(start);cycleEnd.setDate(cycleEnd.getDate()+days-1);
    var cycleEndStr=cycleEnd.toISOString().split('T')[0];
    // Add any paper added via log during/before cycle
    c.paperLog.forEach(function(e){if(e.action==='add'&&e.date<=cycleEndStr)titlesInCycle.add(e.title);});
    // Remove any paper that was removed before the cycle started
    c.paperLog.forEach(function(e){
      if(e.action==='remove'&&e.date<start)titlesInCycle.delete(e.title);
    });
  }

  // Calculate delivery days — days customer received anything
  var allDelivDays=[...new Set([].concat.apply([],[...titlesInCycle].map(function(p){
    const it=st.stock.find(function(s){return s.title===p;});
    return(it&&it.freq==='daily'&&it.deliveryDays)||[];
  })))];
  if(!allDelivDays.length)allDelivDays=[...new Set([].concat.apply([],c.papers.map(function(p){
    const it=st.stock.find(function(s){return s.title===p;});
    return(it&&it.freq==='daily'&&it.deliveryDays)||[];
  })))];
  const cd=start?countDeliveryDays(c,start,days,allDelivDays.length?allDelivDays:[1,2,3,4,5,6,0]):Math.max(0,days-hd);

  const lines=[...titlesInCycle].map(function(title){
    const item=st.stock.find(function(s){return s.title===title;});if(!item)return null;
    let d2,lbl,priceChanged=false,blendedTotal=0;

    if(item.freq==='weekly'){
      // Count Wednesdays where paper was active
      if(start){
        d2=0;blendedTotal=0;
        for(var i=0;i<days;i++){
          var dd=new Date(start);dd.setDate(dd.getDate()+i);
          var ds=dd.toISOString().split('T')[0];
          if((item.deliveryDays||[3]).indexOf(dd.getDay())>=0&&!onHoliday(c,ds)){
            var activeThen=papersOnDate(c,ds);
            if(activeThen.indexOf(title)>=0){
              d2++;blendedTotal+=priceOnDate(item,ds);
            }
          }
        }
      } else {
        d2=Math.floor(days/7);blendedTotal=item.sellPrice*d2;
      }
      lbl=d2+' week'+(d2!==1?'s':'');
      const ga=(!c.gstExempt&&item.gstApplicable)?blendedTotal*(gst/100):0;
      return{title,unitPrice:d2>0?blendedTotal/d2:item.sellPrice,freq:item.freq,deliveryDays:item.deliveryDays,days:d2,label:lbl,lineTotal:blendedTotal,gstAmt:ga,priceChanged:false};

    } else if(item.freq==='monthly'){
      // Monthly — only charge if active at start of cycle
      if(start){
        var activeAtStart=papersOnDate(c,start);
        if(activeAtStart.indexOf(title)<0)return null;
      }
      d2=1;lbl='1 issue';
      const unitPrice=priceOnDate(item,start||tod());
      const lt=unitPrice*d2;
      const ga=(!c.gstExempt&&item.gstApplicable)?lt*(gst/100):0;
      return{title,unitPrice,freq:item.freq,deliveryDays:item.deliveryDays,days:d2,label:lbl,lineTotal:lt,gstAmt:ga,priceChanged:false};

    } else {
      // Daily paper — count days it was active
      const ddays=item.deliveryDays||[1,2,3,4,5];
      if(start){
        d2=0;blendedTotal=0;
        for(var i=0;i<days;i++){
          var dd=new Date(start);dd.setDate(dd.getDate()+i);
          var ds=dd.toISOString().split('T')[0];
          if(ddays.indexOf(dd.getDay())>=0&&!onHoliday(c,ds)){
            var activeThen=papersOnDate(c,ds);
            if(activeThen.indexOf(title)>=0){
              d2++;blendedTotal+=priceOnDate(item,ds);
            }
          }
        }
      } else {
        d2=Math.round(days*(ddays.length/7));blendedTotal=item.sellPrice*d2;
      }
      lbl=d2+' issue'+(d2!==1?'s':'');
      if(d2===0)return null;
      const ga=(!c.gstExempt&&item.gstApplicable)?blendedTotal*(gst/100):0;
      return{title,unitPrice:d2>0?blendedTotal/d2:item.sellPrice,freq:item.freq,deliveryDays:item.deliveryDays,days:d2,label:lbl,lineTotal:blendedTotal,gstAmt:ga,priceChanged:false};
    }
  }).filter(Boolean);

  const pt=lines.reduce(function(s,l){return s+l.lineTotal;},0);
  const weeks=Math.round(days/7); const dt=c.deliveryCharge*weeks; // flat weekly charge
  const dg=!c.gstExempt?dt*(gst/100):0;
  const gt=lines.reduce(function(s,l){return s+l.gstAmt;},0)+dg;
  const sub=pt+dt;
  const total=sub+gt;
  const anyPriceChange=lines.some(function(l){return l.priceChanged;});
  return{lines,papersTotal:pt,deliveryTotal:dt,deliveryGst:dg,gstTotal:gt,subtotal:sub,grandTotal:total,holidayDays:hd,chargeDays:cd,anyPriceChange};
}


function checkWedCharge(){
  const ts=tod();const d=new Date(ts);
  if(d.getDay()!==3||st.lastWedCharge===ts)return;
  const wm=st.stock.filter(s=>s.type==='magazine'&&s.freq==='weekly');
  if(!wm.length)return;
  let charged=false;
  st.customers=st.customers.map(c=>{
    const cw=c.papers.filter(p=>wm.some(m=>m.title===p));if(!cw.length)return c;
    const onH=(c.holidays||[]).some(h=>(h.type==='range'&&ts>=h.start&&ts<=h.end)||(h.type==='day'&&h.date===ts));
    if(onH)return c;
    const charge=cw.reduce((s,p)=>{const it=wm.find(m=>m.title===p);return s+(it?it.sellPrice:0);},0);
    const g=!c.gstExempt?charge*((st.gstEnabled?st.gstRate:0)/100):0;
    charged=true;
    return{...c,balance:parseFloat((c.balance-charge-g).toFixed(2))};
  });
  if(charged){st.lastWedCharge=ts;st.payments=[...st.payments,{id:uuidv4(),customerId:0,amount:0,date:ts,note:'Auto: Weekly magazines — Wednesday '+fd(ts)}];pa();}
}

function buildWeeklyRows(c,start){
  const rows=[];
  for(let w=0;w<4;w++){

    const wEnd=new Date(wStart);wEnd.setDate(wEnd.getDate()+6);
    const wBill=calcBill(c,wStart.toISOString().split('T')[0],7);
    rows.push({label:'Week '+(w+1)+' — w/e '+wEnd.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),total:wBill.grandTotal,hdays:wBill.holidayDays});
  }
  return rows;
}

function exportICS(){
  const pad=n=>String(n).padStart(2,'0');

  const stamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const esc=s=>(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const ics=d=>d.replace(/-/g,'');
  const nxt=d=>{const x=new Date(d);x.setDate(x.getDate()+1);return x.toISOString().split('T')[0];};
  let evs=[];
  st.customers.forEach(c=>{(c.holidays||[]).forEach((h,i)=>{
    if(h.type==='range'&&h.start&&h.end)evs.push(`BEGIN:VEVENT\r\nUID:h-${c.id}-${i}@cjt\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${ics(h.start)}\r\nDTEND;VALUE=DATE:${ics(nxt(h.end))}\r\nSUMMARY:🏖 ${esc(c.name)} Holiday\r\nCATEGORIES:Customer Holiday\r\nEND:VEVENT`);
    else if(h.type==='day'&&h.date)evs.push(`BEGIN:VEVENT\r\nUID:h-${c.id}-${i}@cjt\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${ics(h.date)}\r\nDTEND;VALUE=DATE:${ics(nxt(h.date))}\r\nSUMMARY:🏖 ${esc(c.name)} Holiday (1 day)\r\nCATEGORIES:Customer Holiday\r\nEND:VEVENT`);
  });});
  st.calEvents.forEach((e,i)=>{if(!e.date)return;evs.push(`BEGIN:VEVENT\r\nUID:ev-${i}@cjt\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${ics(e.date)}\r\nDTEND;VALUE=DATE:${ics(nxt(e.date))}\r\nSUMMARY:📌 ${esc(e.text)}\r\nCATEGORIES:Shop Event\r\nEND:VEVENT`);});
  const cal=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CJ Torode//EN\r\nX-WR-CALNAME:${esc(st.bizDetails.name||'CJ Torode')}\r\nX-WR-TIMEZONE:Europe/London\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n${evs.join('\r\n')}\r\nEND:VCALENDAR`;

// DOM helpers
function el(tag,attr,...ch){
  const e=document.createElement(tag);
  if(attr)Object.entries(attr).forEach(([k,v])=>{
    if(k==='onclick')e.addEventListener('click',v);
    else if(k==='onchange')e.addEventListener('change',v);
    else if(k==='oninput')e.addEventListener('input',v);
    else if(k==='className')e.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='checked'&&tag==='input')e.checked=v;
    else if(k==='value'&&(tag==='input'||tag==='textarea'))e.value=v!=null?v:'';
    else if(k==='value'&&tag==='select'){e._pendingValue=v!=null?String(v):'';}// set after options added
    else if(k==='disabled')e.disabled=v;
    else if(k==='type')e.type=v;
    else if(k==='placeholder')e.placeholder=v;
    else if(k==='min')e.min=v;
    else if(k==='max')e.max=v;
    else if(k==='step')e.step=v;
    else e.setAttribute(k,v);
  });
  ch.flat(Infinity).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c);});
  if(e._pendingValue!==undefined){e.value=e._pendingValue;delete e._pendingValue;}
  return e;
}

};

function rCustomers(){
  // Ensure all customers have a listOrder
  let needsOrder=st.customers.some(c=>c.listOrder===undefined);
  if(needsOrder){st.customers=st.customers.map((c,i)=>c.listOrder!==undefined?c:{...c,listOrder:i});ps('customers');}

  function moveCustomer(id,dir){
    const sorted=[...st.customers].sort((a,b)=>(a.listOrder||0)-(b.listOrder||0));
    const idx=sorted.findIndex(c=>c.id===id);
    const swapIdx=dir==='up'?idx-1:idx+1;
    if(swapIdx<0||swapIdx>=sorted.length)return;
    const a=sorted[idx],b=sorted[swapIdx];
    st.customers=st.customers.map(c=>{
      if(c.id===a.id)return{...c,listOrder:b.listOrder};
      if(c.id===b.id)return{...c,listOrder:a.listOrder};
      return c;
    });
    ps('customers');render();
  }

  const visibleCustomers=isDriver()?st.customers.filter(c=>c.roundId==='round-2'):st.customers;
  const sorted=[...visibleCustomers].sort((a,b)=>{
    // When filtering by a specific round, sort by roundOrder; otherwise by listOrder
    if(st.customerRoundFilter!=='all'){
      return (a.roundOrder||99)-(b.roundOrder||99);
    }
    return (a.listOrder||0)-(b.listOrder||0);
  });
  const fil=sorted.filter(c=>{
    const matchSearch=c.name.toLowerCase().includes(st.search.toLowerCase())||c.address.toLowerCase().includes(st.search.toLowerCase());
    const matchRound=st.customerRoundFilter==='all'||c.roundId===st.customerRoundFilter;
    return matchSearch&&matchRound;
  });
  const ts=tod();
  const roundFilters=[{id:'all',name:'All Rounds'},...st.rounds.map(r=>({id:r.id,name:r.name}))];
  return h('div',{},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}},
      h('h2',{className:'st',style:{marginBottom:'0',flex:'1'}},'Customer Records'),
      btn('b1','+ Add Customer',()=>{st.showAddCustomer=true;render();})
    ),
    h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}},
      ...roundFilters.map(r=>h('button',{
        className:'btn '+(st.customerRoundFilter===r.id?'b2':'b3'),
        onclick:()=>{st.customerRoundFilter=r.id;render();}
      },r.name+(r.id!=='all'?' ('+st.customers.filter(c=>c.roundId===r.id).length+')':''))),
      h('span',{style:{marginLeft:'auto',fontSize:'13px',color:'#888',alignSelf:'center'}},fil.length+' customer'+(fil.length!==1?'s':''))
    ),
    h('input',{className:'fi',placeholder:'Search by name or address…',value:st.search,oninput:e=>{st.search=e.target.value;render();},style:{marginBottom:'14px'}}),
    h('div',{style:{display:'grid',gap:'10px'}},
      ...fil.map((c,i)=>{
        const r=st.rounds.find(x=>x.id===c.roundId);
        const bill=calcBill(c,getBillingStart(c),28);
        const onH=(c.holidays||[]).some(h=>(h.type==='range'&&ts>=h.start&&ts<=h.end)||(h.type==='day'&&h.date===ts));
        const isFirst=i===0;const isLast=i===fil.length-1;
        return h('div',{className:'card',style:{display:'flex',gap:'10px',alignItems:'center',padding:'14px 18px'}},
          // Move buttons
          h('div',{style:{display:'flex',flexDirection:'column',gap:'3px',flexShrink:0}},
            h('button',{className:'btn b3',style:{padding:'3px 7px',fontSize:'12px',opacity:isFirst?0.3:1},onclick:()=>moveCustomer(c.id,'up'),disabled:isFirst},'▲'),
            h('button',{className:'btn b3',style:{padding:'3px 7px',fontSize:'12px',opacity:isLast?0.3:1},onclick:()=>moveCustomer(c.id,'down'),disabled:isLast},'▼')
          ),
          h('div',{style:{flex:1}},
            h('div',{style:{fontWeight:'bold',fontSize:'16px'}},c.name),
            h('div',{style:{fontSize:'13px',color:'#666',marginTop:'2px'}},'📍 '+c.address+' · 📞 '+c.phone),
            h('div',{style:{marginTop:'5px',display:'flex',flexWrap:'wrap',gap:'4px'}},
              ...c.papers.map(p=>h('span',{className:'tag'},p)),
              h('span',{className:'tag tag-g'},'🚚 '+fmt(c.deliveryCharge)+'/week'),
              r?h('span',{className:'tag tag-b'},'🚲 '+r.name):null,
              c.gstExempt?h('span',{className:'tag tag-r'},'GST Exempt'):null,
              onH?h('span',{className:'tag tag-b'},'🏖 On Holiday'):null
            ),
            c.deliveryNote?h('div',{style:{fontSize:'12px',color:'#b94040',marginTop:'4px'}},'📌 '+c.deliveryNote):null,
            (c.holidays||[]).length?h('div',{style:{fontSize:'12px',color:'#5a7ec8',marginTop:'3px'}},'🏖 '+c.holidays.length+' holiday'+(c.holidays.length!==1?'s':'')+' on record'):null
          ),
          h('div',{style:{textAlign:'right',minWidth:'150px'}},
            h('div',{style:{fontSize:'18px',fontWeight:'bold',color:c.balance<0?'#b94040':'#2a5e2a'}},c.balance<0?'-'+fmt(c.balance):'Clear'),
            h('div',{style:{fontSize:'11px',color:'#888',marginBottom:'6px'}},'~'+fmt(bill.grandTotal)+'/cycle'),
            h('div',{style:{display:'flex',gap:'6px',justifyContent:'flex-end',flexWrap:'wrap'}},
              btn('b2','💳 Pay',()=>{st.showPayment=c.id;st.paymentAmount='';st.paymentNote='';render();}),
              btn('b2',{style:{background:'#1a1a1a',color:'#c8a84b'}},'🖨/📧 Bill',()=>showBillModal(c.id)),
              btn('b3','✏ Edit',()=>{st.showEditCustomer={...c};render();}),
              btn('b4','🏖 Holiday',()=>{st.showHoliday=c.id;render();}),
              btn('b3','📋 Papers',()=>{st.showPaperLog=c.id;st.paperChangeDate=tod();st.paperChangeTitle=(st.stock[0]&&st.stock[0].title)||'';st.paperChangeAction='add';render();}),
              btn('b6','🗑',()=>{if(confirm('Delete '+c.name+'?\n\nThis cannot be undone.')){const delId=c.id;st.customers=st.customers.filter(x=>x.id!==c.id);S.set('customers',st.customers);DB.deleteCustomer(delId);render();toast('✓ '+c.name+' deleted');}})
            )
          )
        );
      })
    )
  );
}

          const una=st.customers.filter(c=>!c.roundId);
          function mv(cid,dir){
            // Renumber all customers in round sequentially first to avoid duplicates
            const renumbered=inR.map((c,i)=>({...c,roundOrder:i+1}));
            st.customers=st.customers.map(c=>{
              const r=renumbered.find(x=>x.id===c.id);
              return r?r:c;

            const idx=inR2.findIndex(c=>c.id===cid);
            const si=dir==='up'?idx-1:idx+1;

            const a=inR2[idx],b=inR2[si];
            const aOrder=a.roundOrder, bOrder=b.roundOrder;
            st.customers=st.customers.map(c=>{
              if(c.id===a.id)return{...c,roundOrder:bOrder};
              if(c.id===b.id)return{...c,roundOrder:aOrder};
              return c;

            ps('customers');render();

          return h('div',{},

              h('div',{},h('div',{style:{fontWeight:'bold',fontSize:'16px'}},r.name),h('div',{style:{fontSize:'13px',color:'#888'}},r.area+' · '+inR.length+' stops')),

                c.deliveryNote?h('div',{style:{fontSize:'11px',color:'#b94040',marginTop:'2px'}},'📌 '+c.deliveryNote):null
              ),
              h('div',{style:{display:'flex',flexDirection:'column',gap:'3px'}},
                h('button',{className:'btn b3',style:{fontSize:'12px',padding:'3px 8px',opacity:i===0?0.3:1},onclick:()=>mv(c.id,'up'),disabled:i===0},'▲'),
                h('button',{className:'btn b3',style:{fontSize:'12px',padding:'3px 8px',opacity:i===inR.length-1?0.3:1},onclick:()=>mv(c.id,'down'),disabled:i===inR.length-1},'▼')
              ),
              h('button',{style:{background:'none',border:'none',color:'#b94040',cursor:'pointer',fontSize:'16px'},onclick:()=>{st.customers=st.customers.map(cu=>cu.id===c.id?{...cu,roundId:null}:cu);ps('customers');render();}},'✕')
            )),
            una.length?h('div',{style:{marginTop:'16px',paddingTop:'14px',borderTop:'1px dashed #ccc'}},
              h('div',{style:{fontSize:'12px',color:'#888',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'.5px'}},'Add unassigned customer:'),
              h('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px'}},...una.map(c=>h('button',{className:'btn b3',style:{fontSize:'12px'},onclick:()=>{
                const mo=Math.max(0,...st.customers.filter(cu=>cu.roundId===r.id).map(cu=>cu.roundOrder));
                st.customers=st.customers.map(cu=>cu.id===c.id?{...cu,roundId:r.id,roundOrder:mo+1}:cu);ps('customers');render();
              }},'+ '+c.name)))
            ):null
          );
        })()

    )

function rBilling(){
  const ce=new Date(st.billingStart);ce.setDate(ce.getDate()+27);
  const ces=ce.toISOString().split('T')[0];
  const ce2=new Date(st.billingStart2);ce2.setDate(ce2.getDate()+27);
  const ces2=ce2.toISOString().split('T')[0];
  const over=tod()>ces;
  const dl=Math.ceil((ce-new Date())/86400000);

  // Shared helper to get filtered customer list — sorted by delivery order
  function getBillingCusts(){
    const allC = isDriver()?st.customers.filter(c=>c.roundId==='round-2'):st.customers;
    const filtered=(st.billingRoundFilter&&st.billingRoundFilter!=='all')?allC.filter(c=>c.roundId===st.billingRoundFilter):allC;

      h('div',{style:{fontSize:'12px',color:'#888',fontWeight:'bold',textTransform:'uppercase',letterSpacing:'.5px',marginRight:'4px'}},'Round:'),
      ...[{id:'all',name:'All'},...st.rounds].map(r=>
        h('button',{
          style:{padding:'6px 14px',fontSize:'12px',fontFamily:'Georgia,serif',borderRadius:'3px',cursor:'pointer',

function newBlankWeek(){
  const now = new Date();
  // Find Monday of current week
  const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  const fmt = d => d.toISOString().split('T')[0];
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const days = ['mon','tue','wed','thu','fri','sat','sun'];
  const papers = SHOP_DAILY.map(p => {
    const dayData = {};
    days.forEach(d => { dayData[d] = {del:'', ret:''}; });
    return { title: p.title, weekPrice: p.weekPrice, satPrice: p.satPrice, sunPrice: p.sunPrice, days: dayData };
  });
  const mags = (S.get('shopMagList', SHOP_MAGS_DEFAULT)).map(title => ({
    title, delQty:'', delPrice:'', retQty:'', retPrice:''
  }));
  return {
    id: Date.now(),
    weekStart: fmt(mon),
    weekEnd: fmt(sun),
    invoiceNum: Date.now() % 100000,
    papers,
    mags,
    overdue: 0,
    vouchers: 0,
    note: '',
    saved: false
  };
}

function shopCalcWeek(wk){
  const days = ['mon','tue','wed','thu','fri','sat','sun'];
  let dailyTotal = 0, satTotal = 0, sunTotal = 0;
  wk.papers.forEach(p => {
    // Mon-Fri
    ['mon','tue','wed','thu','fri'].forEach(d => {
      const del = parseFloat(p.days[d]?.del) || 0;
      const ret = parseFloat(p.days[d]?.ret) || 0;
      if(p.weekPrice > 0) dailyTotal += (del - ret) * p.weekPrice;
    });
    // Sat
    const sdel = parseFloat(p.days.sat?.del) || 0;
    const sret = parseFloat(p.days.sat?.ret) || 0;
    if(p.satPrice > 0) satTotal += (sdel - sret) * p.satPrice;
    // Sun
    const sudel = parseFloat(p.days.sun?.del) || 0;
    const suret = parseFloat(p.days.sun?.ret) || 0;
    if(p.sunPrice > 0) sunTotal += (sudel - suret) * p.sunPrice;
  });
  let magDel = 0, magRet = 0;
  wk.mags.forEach(m => {
    magDel += (parseFloat(m.delQty)||0) * (parseFloat(m.delPrice)||0);
    magRet += (parseFloat(m.retQty)||0) * (parseFloat(m.retPrice)||0);
  });
  const totalPapers = dailyTotal + satTotal + sunTotal;
  const totalMags = magDel - magRet;
  const discPaper = totalPapers * (st.shopDiscountPaper / 100);
  const discMag = totalMags * (st.shopDiscountMag / 100);
  const totalDiscount = discPaper + discMag;
  const overdue = parseFloat(wk.overdue)||0;
  const vouchers = parseFloat(wk.vouchers)||0;
  const totalDue = totalPapers + totalMags - totalDiscount - vouchers + overdue;
  return { dailyTotal, satTotal, sunTotal, totalPapers, magDel, magRet, totalMags, discPaper, discMag, totalDiscount, totalDue };
}

    // Camera scan helper (uses Anthropic Vision API if available)
    const doScan = async () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
      inp.onchange = async e => {
        const file = e.target.files[0]; if(!file) return;
        const toastEl = document.getElementById('scan-toast');
        if(toastEl) toastEl.style.display='block';
        const reader = new FileReader();
        reader.onload = async ev => {
          // Compress image aggressively to stay under Netlify 6MB limit
          const compressImage = (dataUrl) => new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const maxW = 1000, maxH = 1000;
              let w = img.width, h = img.height;
              const ratio = Math.min(maxW/w, maxH/h);
              w = Math.round(w*ratio); h = Math.round(h*ratio);
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.65));
            };
            img.src = dataUrl;
          });
          const compressed = await compressImage(ev.target.result);
          const b64 = compressed.split(',')[1];

            const resp = await fetch('/.netlify/functions/scan', {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                model:'claude-sonnet-4-20250514',
                max_tokens:2000,
                messages:[{
                  role:'user',
                  content:[
                    {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},

════════════════════════════════

  Mail / Mal / Maol                    → Mail
  Sun / Sen                            → Sun
  Exp / Exps / Expres                  → Express
  Star / Ster                          → Star  ← IMPORTANT: "Star" is a newspaper TITLE, the number next to it is the delivery quantity
  Tnes / Tims / Times / Tes            → Times

  GP / G.P. / Guern Press              → Guernsey Press

════════════════════════════════

════════════════════════════════

  TAB Monthly / TAB Mthly / Tab Month  → Take A Break Monthly
  TAB Arrow / TAB Arrow / TAB Arrwds / TAB Mini → TAB Mini Arrowords Collection
  Thats Life / Ttds Life / Thts Life / Tlds Life → That's Life Weekly
  Total TV / Total Tu / Tot TV / TTV   → Total TV Guide
  TV Stream / Tu Stream / TV & Stream  → TV & Streaming Weekly
  TV Choice / TV Chice / Tu Chae / TVC → TV Choice
  Whats on TV / Wlcb on Tu / Whts TV   → Whats On TV Weekly
  Woman / Wonan / Wom                  → Woman
  W Own / Womans Own / W Owm           → Womans Own
  W Weekly / W Wekly / W Wkly / WW     → Womans Weekly
  Yours / Yous / Yrs                   → Yours

════════════════════════════════
READING THE NUMBERS
════════════════════════════════

PAPERS (top section):
  Format: TITLE  [del qty]  [ret qty]
  - First number = delivery quantity
  - Second number (if present) = returns quantity
  - The page heading shows the day (e.g. "Thurs 14 May" = Thursday)
  - All quantities on that page are for that single day

MAGAZINES (lower section):

{

// ── MAIN RENDER ───────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');app.innerHTML='';
  const tabs=isDriver()?[{k:'customers',i:'👥',l:'Customers'},{k:'rounds',i:'🚲',l:'Rounds'},{k:'billing',i:'£',l:'Billing'}]:[{k:'dashboard',i:'⊞',l:'Dashboard'},{k:'customers',i:'👥',l:'Customers'},{k:'rounds',i:'🚲',l:'Rounds'},{k:'billing',i:'£',l:'Billing'},{k:'stock',i:'📦',l:'Stock'},{k:'calendar',i:'📅',l:'Calendar'},{k:'shop',i:'🏪',l:'Shop'}];
  app.appendChild(h('header',{className:'hdr'},h('div',{className:'hdr-in'},
    h('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},h('span',{style:{fontSize:'28px'}},'🗞'),h('div',{},h('div',{className:'logo-n'},'C J TORODE'),h('div',{className:'logo-s'},'Newsagent'))),
    h('div',{style:{display:'flex',alignItems:'center',gap:'14px'}},
      h('div',{style:{fontSize:'11px',color:getSB()?'#4a8a4a':'#888',letterSpacing:'.5px'}},getSB()?'☁ Cloud Sync':'💾 Local Only'),
      h('div',{style:{fontSize:'13px',color:'#888'}},new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})),
      h('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},
        isAdmin()?btn('btn b3','⚙ Settings',()=>{st.showSettings=true;render();}):null,
        isDriver()?h('span',{style:{fontSize:'11px',color:'#c8a84b',padding:'5px 8px',background:'#2c2c2c',borderRadius:'3px'}},'🚲 Round 2'):null,
        h('button',{className:'btn b3',style:{fontSize:'12px',padding:'5px 12px'},onclick:()=>{if(confirm('Log out?')){doLogout();showPinScreen();}}},'🔒')
      )
    )
  )));
  app.appendChild(h('nav',{className:'nav'},h('div',{className:'nav-in'},
    ...tabs.map(t=>h('button',{className:'nb'+(st.tab===t.k?' on':''),onclick:()=>{st.tab=t.k;render();}},t.i+' '+t.l)),
    st.gstEnabled?h('div',{style:{marginLeft:'auto',padding:'0 16px',fontSize:'12px',color:'#c8a84b',letterSpacing:'1px'}},'✓ GST '+st.gstRate+'%'):null
  )));
  var tabFn={dashboard:rDash,customers:rCustomers,rounds:rRounds,billing:rBilling,stock:rStock,calendar:rCal,shop:rShop}[st.tab];
  const content=tabFn?tabFn():h('div',{});
  app.appendChild(h('main',{className:'main'},content||h('div',{})));
  app.appendChild(h('div',{style:{height:'40px'}}));
  rModals().forEach(m=>app.appendChild(m));
}

// Always correct deliveryDays based on type and freq
(function fixStockDeliveryDays(){
  var changed=false;
  st.stock=st.stock.map(function(s){
    var fix={...s};
    if(s.type==='magazine'){
      if(s.freq==='weekly'){fix.deliveryDays=[3];changed=true;}
      else if(s.freq==='monthly'){fix.deliveryDays=[];changed=true;}
    }
    return fix;
  });
  if(changed) S.set('stock', st.stock); // local only on startup
})();

checkWedCharge();

if(!localStorage.getItem('cjt_sbUrl')){
  showSetupScreen();
} else if(!isLoggedIn()){
  showPinScreen();
} else {

}
